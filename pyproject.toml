[project]
name = "terrahunter"
version = "0.1.0.dev0"
description = "Point it at your Terraform: it maps the infrastructure as a diagram and walks you through the paths an attacker could chain through it."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "adamtty" }]
keywords = ["terraform", "opentofu", "security", "iac", "attack-path", "diagram", "aws"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
requires-python = ">=3.11"
dependencies = [
    "python-hcl2>=8.1.2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
extend-select = ["S", "B"]  # bandit security rules and bugbear on top of the defaults
ignore = ["S603", "S607"]  # subprocess calls always pass an argv list, and the tools they run are found on PATH

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # asserts are how tests check results

[project.urls]
Homepage = "https://github.com/adamtty/terrahunter"
Issues = "https://github.com/adamtty/terrahunter/issues"

[project.scripts]
terrahunter = "terrahunter.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/terrahunter"]
